
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#74183f">
<title>MER JEWELLERY | Admin Dashboard</title>
<style>
:root{--pink:#a52d60;--dark:#54132f;--bg:#fff6f9;--muted:#806b75;--line:#f0dce5}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#35232b}
header{background:linear-gradient(130deg,#50112f,#a52d60,#d85d91);color:white;padding:24px 18px}
.top{max-width:1000px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:22px;font-weight:800;letter-spacing:.5px}
.sub{font-size:13px;opacity:.85;margin-top:6px}
main{max-width:1000px;margin:22px auto;padding:0 15px 40px}
.card{background:white;border:1px solid var(--line);border-radius:17px;padding:20px;margin:16px 0;box-shadow:0 8px 28px #6c20400a}
h2{font-size:19px;margin:0 0 16px}
label{display:block;font-size:14px;font-weight:700;margin:13px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #e4d4dc;border-radius:10px;font:inherit;background:#fff;color:#35232b}
textarea{min-height:85px;resize:vertical}
button{border:0;border-radius:10px;padding:12px 15px;background:var(--pink);color:white;font-weight:700;font-size:14px;cursor:pointer}
button:disabled{opacity:.55}
button.secondary{background:#735a67}
button.danger{background:#b4233e}
button.light{background:#f9e8ef;color:#762347}
button.small{padding:9px 11px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.actions button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.product{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.product img{width:100%;height:190px;object-fit:cover;background:#f9edf2}
.pbody{padding:14px}
.pname{font-weight:800;font-size:16px;overflow-wrap:anywhere}
.price{color:var(--pink);font-weight:800;margin:8px 0}
.meta{color:var(--muted);font-size:13px}
.desc{font-size:14px;line-height:1.5;overflow-wrap:anywhere;margin:9px 0}
.product .actions{margin-top:12px}
#preview{display:block;max-width:100%;max-height:220px;border-radius:12px;margin-top:12px}
.status{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font-size:14px}
.note{background:#fff0f5;padding:12px;border-radius:10px;font-size:13px;line-height:1.5}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar input{flex:1;min-width:150px}
.hidden{display:none!important}
.badge{display:inline-block;background:#f9e8ef;color:#84234c;padding:5px 9px;border-radius:20px;font-size:12px;margin-top:8px}
@media(max-width:480px){.card{padding:15px}.brand{font-size:19px}.top{align-items:flex-start}header{padding:20px 14px}}
</style>
</head>
<body>
<header>
 <div class="top">
  <div>
   <div class="brand">MER JEWELLERY</div>
   <div class="sub">Professional Admin Dashboard</div>
  </div>
  <button id="logoutBtn" class="secondary hidden">Logout</button>
 </div>
</header>

<main>
 <section class="card" id="loginCard">
  <h2>Admin Login</h2>
  <form id="loginForm">
   <label for="email">Email</label>
   <input id="email" type="email" autocomplete="username" required>
   <label for="password">Password</label>
   <input id="password" type="password" autocomplete="current-password" required>
   <button id="loginBtn" style="width:100%;margin-top:18px">Login to Dashboard</button>
  </form>
  <p id="loginStatus" class="status" role="status"></p>
 </section>

 <section id="dashboard" class="hidden">
  <div class="card">
   <h2 id="formTitle">＋ નવી પ્રોડક્ટ ઉમેરો</h2>
   <form id="productForm">
    <label for="name">પ્રોડક્ટનું નામ *</label>
    <input id="name" required maxlength="160" placeholder="MER Rose Ring">

    <label for="price">કિંમત (₹) *</label>
    <input id="price" type="number" min="1" step="1" required placeholder="1500">

    <label for="category">કેટેગરી</label>
    <select id="category">
     <option>Ring</option><option>Pendant</option><option>Earring</option>
     <option>Bangle</option><option>Necklace</option><option>Custom Models</option>
    </select>

    <label for="details">પ્રોડક્ટની વિગતો</label>
    <textarea id="details" placeholder="પ્રોડક્ટ વિશે માહિતી લખો"></textarea>

    <label for="photo">પ્રોડક્ટનો ફોટો</label>
    <input id="photo" type="file" accept="image/jpeg,image/png,image/webp">
    <img id="preview" class="hidden" alt="Photo preview">

    <p class="note">JPG, PNG અથવા WebP, મહત્તમ 5 MB. નવી પ્રોડક્ટ માટે ફોટો જરૂરી છે. Edit કરતી વખતે નવો ફોટો પસંદ કરવો વૈકલ્પિક છે.</p>
    <div class="actions">
     <button id="saveBtn" type="submit">પ્રોડક્ટ સેવ કરો</button>
     <button id="cancelBtn" type="button" class="secondary hidden">Edit રદ કરો</button>
    </div>
   </form>
   <p id="productStatus" class="status" role="status"></p>
  </div>

  <div class="card">
   <h2>તમારી પ્રોડક્ટ્સ</h2>
   <div class="toolbar">
    <input id="search" placeholder="🔎 નામથી શોધો...">
    <button id="refreshBtn" type="button" class="light">Refresh</button>
   </div>
   <p id="listStatus" class="status" role="status">પ્રોડક્ટ્સ લોડ થઈ રહી છે...</p>
   <div id="productList" class="grid"></div>
  </div>
 </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
 const URL='https://djnobdajkadqqafenckq.supabase.co';
 const KEY='sb_publishable_xkFw4ge02yl_op6cdfwCvA_K2ilylUF';
 const $=id=>document.getElementById(id);
 let db, products=[], editingId=null, oldImageUrl=null, previewUrl=null;

 const loginCard=$('loginCard'), dashboard=$('dashboard');
 const loginStatus=$('loginStatus'), productStatus=$('productStatus');
 const form=$('productForm'), photo=$('photo'), preview=$('preview');

 function sessionUI(session){
  loginCard.classList.toggle('hidden',!!session);
  dashboard.classList.toggle('hidden',!session);
  $('logoutBtn').classList.toggle('hidden',!session);
  if(session) loadProducts();
 }
 function say(el,msg){el.textContent=msg}
 function releasePreview(){
  if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=null}
 }
 function clearPreview(){
  releasePreview();preview.src='';preview.classList.add('hidden');
 }
 function showPreview(src){
  preview.src=src;preview.classList.remove('hidden');
 }
 function resetForm(){
  editingId=null;oldImageUrl=null;form.reset();clearPreview();
  $('formTitle').textContent='＋ નવી પ્રોડક્ટ ઉમેરો';
  $('saveBtn').textContent='પ્રોડક્ટ સેવ કરો';
  $('cancelBtn').classList.add('hidden');
  say(productStatus,'');
 }
 function escapeText(value){
  return String(value??'').replace(/[&<>"']/g,c=>({
   '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
 }
 function renderProducts(){
  const term=$('search').value.trim().toLowerCase();
  const list=products.filter(p=>
   String(p.name||'').toLowerCase().includes(term) ||
   String(p.category||'').toLowerCase().includes(term)
  );
  $('productList').innerHTML='';
  if(!list.length){
   say($('listStatus'),products.length?'કોઈ મેળ ખાતી પ્રોડક્ટ મળી નથી.':'હજી કોઈ પ્રોડક્ટ નથી.');
   return;
  }
  say($('listStatus'),'કુલ પ્રોડક્ટ્સ: '+products.length);
  list.forEach(p=>{
   const item=document.createElement('article');
   item.className='product';
   const img=document.createElement('img');
   img.src=p.image_url||'';
   img.alt=p.name||'Product';
   img.loading='lazy';
   img.onerror=()=>{img.style.display='none'};
   const body=document.createElement('div');
   body.className='pbody';
   body.innerHTML=`
    <div class="pname">${escapeText(p.name)}</div>
    <div class="price">₹${Number(p.price||0).toLocaleString('en-IN')}</div>
    <span class="badge">${escapeText(p.category||'Other')}</span>
    <div class="desc">${escapeText(p.details||'વિગતો નથી')}</div>
    <div class="actions">
     <button type="button" class="small edit">Edit</button>
     <button type="button" class="small danger delete">Delete</button>
    </div>`;
   body.querySelector('.edit').addEventListener('click',()=>editProduct(p));
   body.querySelector('.delete').addEventListener('click',()=>deleteProduct(p));
   item.append(img,body);$('productList').append(item);
  });
 }
 async function loadProducts(){
  if(!db)return;
  say($('listStatus'),'પ્રોડક્ટ્સ લોડ થઈ રહી છે...');
  const {data,error}=await db.from('products')
   .select('id,name,price,category,details,image_url,created_at')
   .order('created_at',{ascending:false});
  if(error){
   say($('listStatus'),'પ્રોડક્ટ્સ લોડ ન થઈ: '+error.message+
    '\nSupabaseમાં products SELECT permission તપાસો.');
   return;
  }
  products=data||[];renderProducts();
 }
 function editProduct(p){
  editingId=p.id;oldImageUrl=p.image_url||null;
  $('name').value=p.name||'';
  $('price').value=p.price||'';
  $('category').value=p.category||'Ring';
  $('details').value=p.details||'';
  photo.value='';clearPreview();
  if(oldImageUrl)showPreview(oldImageUrl);
  $('formTitle').textContent='✎ પ્રોડક્ટ સુધારો';
  $('saveBtn').textContent='ફેરફાર સેવ કરો';
  $('cancelBtn').classList.remove('hidden');
  say(productStatus,'તમે હવે '+p.name+' માં ફેરફાર કરી રહ્યા છો.');
  window.scrollTo({top:0,behavior:'smooth'});
 }
 async function deleteProduct(p){
  if(!confirm('શું ખરેખર "'+p.name+'" પ્રોડક્ટ ડિલીટ કરવી છે? આ ક્રિયા પાછી ફેરવી શકાશે નહીં.'))return;
  say($('listStatus'),'પ્રોડક્ટ ડિલીટ થઈ રહી છે...');
  const {error}=await db.from('products').delete().eq('id',p.id);
  if(error){
   say($('listStatus'),'Delete નિષ્ફળ: '+error.message+
    '\nSupabaseમાં DELETE permission તપાસો.');
   return;
  }
  if(editingId===p.id)resetForm();
  say($('listStatus'),'પ્રોડક્ટ ડિલીટ થઈ ગઈ.');
  await loadProducts();
 }
 photo.addEventListener('change',()=>{
  const file=photo.files[0];
  clearPreview();
  if(!file)return;
  if(!file.type.startsWith('image/')){
   say(productStatus,'યોગ્ય ફોટો પસંદ કરો.');photo.value='';return;
  }
  if(file.size>5*1024*1024){
   say(productStatus,'ફોટો 5 MB કરતાં નાનો રાખો.');photo.value='';return;
  }
  previewUrl=URL.createObjectURL(file);showPreview(previewUrl);
 });
 $('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();$('loginBtn').disabled=true;
  say(loginStatus,'Login થઈ રહ્યું છે...');
  try{
   const {data,error}=await db.auth.signInWithPassword({
    email:$('email').value.trim(),password:$('password').value
   });
   if(error)throw error;
   sessionUI(data.session);say(loginStatus,'Login સફળ.');
  }catch(err){say(loginStatus,'Login ભૂલ: '+err.message)}
  finally{$('loginBtn').disabled=false}
 });
 $('logoutBtn').addEventListener('click',async()=>{
  const {error}=await db.auth.signOut();
  if(error){say(productStatus,'Logout ભૂલ: '+error.message);return}
  sessionUI(null);resetForm();
 });
 $('cancelBtn').addEventListener('click',resetForm);
 $('refreshBtn').addEventListener('click',loadProducts);
 $('search').addEventListener('input',renderProducts);

 form.addEventListener('submit',async e=>{
  e.preventDefault();
  $('saveBtn').disabled=true;
  let uploadedPath=null;
  try{
   const {data:sd,error:se}=await db.auth.getSession();
   if(se)throw se;
   if(!sd.session)throw Error('પહેલાં Login કરો.');
   const name=$('name').value.trim();
   const price=Number($('price').value);
   const category=$('category').value;
   const details=$('details').value.trim();
   const file=photo.files[0];
   if(!name)throw Error('પ્રોડક્ટનું નામ લખો.');
   if(!Number.isFinite(price)||price<=0)throw Error('યોગ્ય કિંમત લખો.');
   if(!editingId&&!file)throw Error('નવી પ્રોડક્ટ માટે ફોટો પસંદ કરો.');
   if(file&&file.size>5*1024*1024)throw Error('ફોટો 5 MB કરતાં નાનો રાખો.');

   let image_url=oldImageUrl;
   if(file){
    const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const path=Date.now()+'-'+Math.random().toString(36).slice(2)+'-'+safe;
    const {data:up,error:ue}=await db.storage.from('product-images')
     .upload(path,file,{upsert:false,contentType:file.type});
    if(ue)throw Error('ફોટો અપલોડ ભૂલ: '+ue.message);
    uploadedPath=up.path;
    image_url=db.storage.from('product-images').getPublicUrl(up.path).data.publicUrl;
   }
   const record={name,price,category,details,image_url};
   let result;
   if(editingId){
    result=await db.from('products').update(record).eq('id',editingId);
   }else{
    result=await db.from('products').insert([record]);
   }
   if(result.error)throw Error('Database ભૂલ: '+result.error.message);
   say(productStatus,editingId?'પ્રોડક્ટ અપડેટ થઈ ગઈ!':'પ્રોડક્ટ સફળતાપૂર્વક ઉમેરાઈ!');
   resetForm();await loadProducts();
  }catch(err){
   say(productStatus,'ભૂલ: '+(err.message||'કંઈક ખોટું થયું.'));
   if(uploadedPath)say(productStatus,productStatus.textContent+'\nફોટો અપલોડ થયો છે; Database સેવ નિષ્ફળ થયું હોઈ શકે છે.');
  }finally{$('saveBtn').disabled=false}
 });

 async function initialize(){
  if(!window.supabase){
   say(loginStatus,'Supabase લોડ થયું નથી. ઇન્ટરનેટ તપાસો.');return;
  }
  db=window.supabase.createClient(URL,KEY);
  db.auth.onAuthStateChange((_event,session)=>sessionUI(session));
  const {data,error}=await db.auth.getSession();
  if(error)say(loginStatus,'Session ભૂલ: '+error.message);
  else sessionUI(data.session);
 }
 initialize();
})();
</script>
</body>
</html>
