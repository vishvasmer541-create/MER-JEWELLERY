
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MER Admin</title>
<style>
body{font-family:Arial;background:#fff5f8;color:#34232b;margin:0}
header{background:#b83268;color:white;text-align:center;padding:18px}
main{max-width:650px;margin:auto;padding:16px}
.card{background:white;padding:20px;border-radius:14px;margin-bottom:18px}
label{display:block;margin-top:14px;font-weight:bold}
input,select,textarea,button{width:100%;padding:12px;margin-top:7px;box-sizing:border-box;font-size:16px;border:1px solid #ddd;border-radius:8px}
button{background:#b83268;color:white;border:0;margin-top:18px}
#preview{max-width:100%;max-height:200px}
#status{white-space:pre-wrap;line-height:1.5}
.hidden{display:none}
</style>
</head>
<body>
<header><h1>MER 3D JEWELLERY FILES</h1><p>Admin Panel</p></header>
<main>
<section class="card" id="loginCard">
<h2>Admin Login</h2>
<label>Email</label><input id="email" type="email">
<label>Password</label><input id="password" type="password">
<button id="loginBtn">Login</button>
<p id="loginStatus"></p>
</section>

<section class="card hidden" id="productCard">
<button id="logoutBtn">Logout</button>
<h2>પ્રોડક્ટ ઉમેરો</h2>
<form id="productForm">
<label>પ્રોડક્ટનું નામ</label>
<input id="name" required placeholder="MER Rose Ring">

<label>કિંમત (₹)</label>
<input id="price" type="number" min="1" required>

<label>કેટેગરી</label>
<select id="category">
<option>Ring</option><option>Pendant</option>
<option>Earring</option><option>Bangle</option>
<option>Necklace</option><option>Custom Models</option>
</select>

<label>વિગતો</label>
<textarea id="details"></textarea>

<label>પ્રોડક્ટનો ફોટો</label>
<input id="photo" type="file" accept="image/*" required>
<img id="preview" hidden alt="Preview">

<p>નોંધ: આ વર્ઝન ફોટો અને પ્રોડક્ટની વિગતો સેવ કરે છે. 3DM/STL ફાઇલો હજી અપલોડ થતી નથી.</p>
<button id="saveBtn" type="submit">પ્રોડક્ટ સેવ કરો</button>
</form>
<p id="status"></p>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL='https://djnobdajkadqqafenckq.supabase.co';
const KEY='sb_publishable_xkFw4ge02yl_op6cdfwCvA_K2ilylUF';
const db=window.supabase.createClient(URL,KEY);
const $=id=>document.getElementById(id);

function show(session){
  $('loginCard').classList.toggle('hidden',!!session);
  $('productCard').classList.toggle('hidden',!session);
}

async function checkSession(){
  const {data,error}=await db.auth.getSession();
  if(error)$('loginStatus').textContent=error.message;
  show(data?.session);
}

$('loginBtn').onclick=async()=>{
  const {data,error}=await db.auth.signInWithPassword({
    email:$('email').value.trim(),
    password:$('password').value
  });
  if(error){
    $('loginStatus').textContent='Login ભૂલ: '+error.message;
    return;
  }
  show(data.session);
};

$('logoutBtn').onclick=async()=>{
  await db.auth.signOut();
  show(null);
};

$('photo').onchange=()=>{
  const f=$('photo').files[0];
  if(f){
    $('preview').src=URL.createObjectURL(f);
    $('preview').hidden=false;
  }
};

$('productForm').onsubmit=async e=>{
  e.preventDefault();
  const btn=$('saveBtn');
  btn.disabled=true;
  $('status').textContent='પ્રોડક્ટ સેવ થઈ રહી છે…';

  try{
    const {data:session}=await db.auth.getSession();
    if(!session.session)throw Error('પહેલાં Admin Login કરો.');

    const file=$('photo').files[0];
    if(!file || !file.type.startsWith('image/'))
      throw Error('યોગ્ય ફોટો પસંદ કરો.');
    if(file.size>5*1024*1024)
      throw Error('ફોટો 5 MB કરતાં નાનો રાખો.');

    const path=Date.now()+'-'+crypto.randomUUID()+'-'+
      file.name.replace(/[^a-zA-Z0-9._-]/g,'_');

    const {data:uploaded,error:uploadError}=await db.storage
      .from('product-images')
      .upload(path,file,{upsert:false,contentType:file.type});

    if(uploadError)throw Error('ફોટો અપલોડ ભૂલ: '+uploadError.message);

    const {data:url}=db.storage.from('product-images')
      .getPublicUrl(uploaded.path);

    const {error}=await db.from('products').insert({
      name:$('name').value.trim(),
      price:Number($('price').value),
      category:$('category').value,
      details:$('details').value.trim(),
      image_url:url.publicUrl
    });

    if(error)throw Error('Database ભૂલ: '+error.message);

    $('status').textContent='સફળ! પ્રોડક્ટ સેવ થઈ ગઈ. હવે વેબસાઇટ Refresh કરો.';
    $('productForm').reset();
    $('preview').hidden=true;
  }catch(err){
    $('status').textContent='ભૂલ: '+err.message;
  }finally{
    btn.disabled=false;
  }
};

db.auth.onAuthStateChange((_event,session)=>show(session));
checkSession();
</script>
</body>
</html>
